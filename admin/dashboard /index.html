<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <nav class="k2-navbar">
        <div id="k2-nav-left"class="k2-nav-left">
            <h2>K2<span>ADMIN</span></h2>
        </div>
        <div class="k2-nav-right">
            <a href="#allUsers">All Users</a>
            <a href="#servicesMen">Services For Men</a>

    <section id="allUsers">
    <div class="k2-dashboard-body">
        <div class="section-header">
            <h3>All Users</h3>
            
        </div>

        <div class="table-wrapper">
            <table class="k2-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Membership</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="5" style="text-align:center; color:#666;">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    </section>
     <section id="servicesMen">
    <div class="k2-dashboard-body">
        <div class="section-header">
            <h3>Services For Men</h3>
            <span id="userCount">0 users
        </div>

        <div class="table-wrapper">
            <table class="k2-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Category</th>
                        <th>Name</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody id="menHairBeardTableBody">

    </div>
    </section>
         <section id="servicesWomen">

                        <th>#</th>

                    </tr>
                </thead>
                <tbody id="womenTableBody">
                    <tr><td colspan="5" style="text-align:center; color:#666;">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    </section>
