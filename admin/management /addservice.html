<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Service - K2</title>
<link rel="stylesheet" href="./addservice.css">
</head>
<body>
<nav class="navbar"><h2>K2 <span>ADD SERVICE</span></h2><a href="/admin/dashboard /index.html">← Dashboard</a></nav>

<div class="container">
  <div class="card">
    <h3>New Service</h3>
    
    <div class="row">
      <div class="group">
        <label>Gender</label>
        <select id="gender">
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="femalee">Female</option>
        </select>
      </div>
      <div class="group">
        <label>Service Type</label>
        <select id="serviceType">
          <option value="">Select Service Type</option>
          <!-- MALE TYPES -->
          <optgroup label="MALE">
            <option value="HAIR & BEARD">HAIR & BEARD</option>
            <option value="COLOUR">COLOUR</option>
            <option value="FACIAL">FACIAL</option>
            <option value="ADVANCE FACIAL">ADVANCE FACIAL</option>
            <option value="HAIR TREATMENTS">HAIR TREATMENTS</option>
            <option value="WELLNESS & RELAXATION">WELLNESS & RELAXATION</option>
          </optgroup>
          <!-- FEMALE TYPES -->
          <optgroup label="FEMALE">
            <option value="HAIR">HAIR</option>
            <option value="NORMAL WAXING">NORMAL WAXING</option>
            <option value="RICA WAXING">RICA WAXING</option>
            <option value="THREADING">THREADING</option>
            <option value="FACIAL LOTUS">FACIAL LOTUS</option>
            <option value="ADVANCE FACIAL LOTUS">ADVANCE FACIAL LOTUS</option>
            <option value="NANOPLASTEIA TREATMENT">NANOPLASTEIA TREATMENT</option>
            <option value="PEDICURE MANICURE">PEDICURE / MANICURE</option>
            <option value="COLOUR">SCHWARKOPE COLOUR</option>
            <option value="COLOUR">LOREAL COLOUR</option>
         
          </optgroup>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="group">
        <label>Service Name</label>
        <input type="text" id="serviceName" placeholder="Ex: Hair Cut">
      </div>
      <div class="group">
        <label>Price ₹</label>
        <input type="number" id="servicePrice" placeholder="Ex: 300">
      </div>
    </div>

    <input type="button" class="submit-btn" id="addBtn" onclick="add()">Add Service</input>
    <p id="msg"></p>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  
  <!-- Firebase Firestore -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-analytics.js"></script>
  <script src="/firebase.js"></script>
<script src="/main.js"></script>
<script src="/admin/management /addservice.js"></script>
</body>
</html>
